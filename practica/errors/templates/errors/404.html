{% extends "errors/base.html" %}
{% load static %}

{% block content %}
<section class="error-section d-flex align-items-center justify-content-center">
    <div class="container px-4 px-lg-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <div class="card error-card shadow-lg border-0 p-5">
                    <div class="card-body">
                        <div class="error-icon mb-3">
                            <i class="fas fa-compass fa-4x text-primary"></i>
                        </div>
                        <h1 class="display-1 fw-bold error-code mb-2">404</h1>
                        <h2 class="text-uppercase fw-bold mb-3">Destino o Filtro No Encontrado</h2>
                        <hr class="mx-auto error-divider mb-4" />
                        <p class="text-muted fs-5 mb-3">
                            {{ mensaje_error }}
                        </p>
                        <p class="small text-secondary mb-4">
                            Ruta consultada: <code>{{ ruta_solicitada }}</code>
                        </p>
                        <div class="d-flex justify-content-center gap-3 flex-wrap">
                            <a href="{% url 'gallery' %}" class="btn btn-primary shadow-sm">
                                <i class="fas fa-images me-2"></i>Ver Todos los Destinos
                            </a>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-home me-2"></i>Volver al Inicio
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
